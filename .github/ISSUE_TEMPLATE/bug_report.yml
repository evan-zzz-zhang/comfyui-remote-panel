name: Bug report
description: Report a reproducible Comfy Remote problem
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before reporting, run `comfyui-remote-panel doctor --report` when possible.

        Privacy: do not upload `config.toml`, databases, full logs, real local paths, Tailscale hostnames/login identities, prompts, uploaded/generated media, API keys, tokens, cookies, passwords, or other secrets. The Doctor report is redacted automatically, but review it before posting.
  - type: input
    id: version
    attributes:
      label: Comfy Remote version
      placeholder: 0.3.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: input
    id: comfyui
    attributes:
      label: ComfyUI version
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: GPU
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: What did you do, what happened, and what did you expect? Replace real paths/identities with placeholders.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor report
      description: Paste the output of `comfyui-remote-panel doctor --report` after reviewing it for private information.
      render: markdown
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I reviewed this issue and removed real identities, paths, secrets, private media, database/config contents, and full logs.
          required: true
