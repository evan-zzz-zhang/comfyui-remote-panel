name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: node --check src/comfyui_remote_panel/static/i18n.js
      - run: node tests/i18n_smoke.js
      - run: node --check src/comfyui_remote_panel/static/app.js
      - run: node --check src/comfyui_remote_panel/static/workflow_ux.js
      - run: node --check src/comfyui_remote_panel/static/configurator_v2.js
      - run: node --check src/comfyui_remote_panel/static/configurator_v2_runtime.js
      - run: node --check src/comfyui_remote_panel/static/v04_ui.js
      - run: node --check src/comfyui_remote_panel/static/v041_ui.js
      - run: node --check src/comfyui_remote_panel/static/v042_ui.js
      - run: node --check src/comfyui_remote_panel/static/v042_patch.js
      - run: node --check src/comfyui_remote_panel/static/v045_ollama_ui.js
      - run: node --check src/comfyui_remote_panel/static/v045_generation_sync.js
      - run: node --check src/comfyui_remote_panel/static/v046_fl2va_ui.js
      - run: node --check src/comfyui_remote_panel/static/v046_job_runtime_ui.js
      - run: node --check src/comfyui_remote_panel/static/v046_workflow_selection_guard.js
      - run: node --check src/comfyui_remote_panel/static/v046_force_stop_ui.js
      - run: node --check src/comfyui_remote_panel/static/v046_sage_attention_status.js
      - run: node --check src/comfyui_remote_panel/static/ux_refinements.js
      - run: node --check src/comfyui_remote_panel/static/recovery_lite.js
      - run: python scripts/check_repository.py
      - run: python -m build

  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -c constraints/minimum.txt -e ".[test]"
      - run: python -m pytest
      - run: python -m build --no-isolation

  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/check_repository.py
      - run: python scripts/check_history.py
