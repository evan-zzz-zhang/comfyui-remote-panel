name: Gate 4 Bridge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  gate4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/v0.3-configurator-2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
      - run: node --check src/comfyui_remote_panel/static/app.js
      - run: node --check src/comfyui_remote_panel/static/workflow_ux.js
      - run: node --check src/comfyui_remote_panel/static/configurator_v2.js
      - run: node --check src/comfyui_remote_panel/static/ux_refinements.js
      - run: python scripts/check_repository.py
      - run: python -m build
